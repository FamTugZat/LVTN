
name: Deploy Laravel to P.A Vietnam

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Kiểm tra kết nối FTP từ GitHub Actions
      - name: Test FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          python - <<'PY'
          import os
          import socket

          host = os.environ["FTP_SERVER"]
          try:
              with socket.create_connection((host, 21), timeout=10):
                  print("FTP port 21 is reachable from GitHub Actions.")
          except Exception as e:
              print(f"FTP connection failed: {type(e).__name__}: {e}")
              raise
          PY

      # 3. Cài PHP 8.4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql
          tools: composer

      # 3. Cài thư viện Laravel
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # 4. Cài Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 5. Cài thư viện frontend
      - name: Install NPM dependencies
        run: npm install

      # 6. Build Vite
      - name: Build frontend
        run: npm run build

      # 7. Chỉnh index.php cho cấu trúc hosting
      - name: Configure Laravel public path
        run: |
          sed -i "s#../vendor/autoload.php#../laravel_app/vendor/autoload.php#" public/index.php
          sed -i "s#../bootstrap/app.php#../laravel_app/bootstrap/app.php#" public/index.php

      # 8. Upload Laravel source lên laravel_app
      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /laravel_app/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/public/**

      # 9. Upload thư mục public lên public_html
      - name: Deploy public files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /public_html/
          local-dir: ./public/